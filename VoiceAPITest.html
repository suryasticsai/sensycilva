<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TTS Debug</title>
<meta http-equiv="Content-Security-Policy" content="connect-src 'self' https://sensycilva.suryasticsai.workers.dev;">
<style>
  body { font-family: system-ui; background: #0d0a1a; color: #eee8ff; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
  .card { background: #1a162c; border-radius: 20px; padding: 2rem; border: 1px solid rgba(255,255,255,0.08); }
  h1 { background: linear-gradient(135deg, #ff2d78, #b06fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  label { display: block; margin: 1rem 0 0.25rem; color: #9990bb; }
  textarea, select, button { width: 100%; padding: 0.75rem; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); background: #0d0a1a; color: #eee8ff; font-size: 1rem; }
  .row { display: flex; gap: 1rem; }
  .row select { flex: 1; }
  button { background: linear-gradient(135deg, #ff2d78, #b06fff); border: none; font-weight: 700; cursor: pointer; margin-top: 1rem; }
  button:hover { transform: scale(1.01); }
  #log { margin-top: 1rem; padding: 0.75rem; border-radius: 10px; background: #0d0a1a; border: 1px solid rgba(255,255,255,0.06); font-family: monospace; font-size: 0.85rem; white-space: pre-wrap; min-height: 4rem; max-height: 300px; overflow-y: auto; }
  #log.success { border-color: #39ff88; color: #39ff88; }
  #log.error { border-color: #ff4560; color: #ff4560; }
  #log.info { border-color: #b06fff; color: #b06fff; }
  audio { width: 100%; margin-top: 1rem; border-radius: 12px; display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>🔊 TTS Debug</h1>
  <p style="color:#9990bb;">This page calls your Worker and shows the full response.</p>

  <label for="textInput">Text</label>
  <textarea id="textInput" rows="3">Hello from SensyCilva!</textarea>

  <div class="row">
    <div><label>Language</label><select id="langSelect"><option value="en-US">English</option><option value="hi-IN">Hindi</option><option value="te-IN">Telugu</option></select></div>
    <div><label>Gender</label><select id="genderSelect"><option value="female">Female</option><option value="male">Male</option></select></div>
  </div>

  <button id="speakBtn">🔊 Speak</button>
  <div id="log">Ready</div>
  <audio id="audioPlayer" controls></audio>
</div>

<script>
  const textInput = document.getElementById('textInput');
  const langSelect = document.getElementById('langSelect');
  const genderSelect = document.getElementById('genderSelect');
  const speakBtn = document.getElementById('speakBtn');
  const log = document.getElementById('log');
  const audioPlayer = document.getElementById('audioPlayer');

  const WORKER_URL = 'https://sensycilva.suryasticsai.workers.dev/api/tts';

  function setLog(msg, type = '') {
    log.textContent = msg;
    log.className = type;
  }

  speakBtn.addEventListener('click', async () => {
    const text = textInput.value.trim();
    if (!text) return setLog('Please enter text.', 'error');

    const language = langSelect.value;
    const gender = genderSelect.value;

    speakBtn.disabled = true;
    setLog('⏳ Requesting…', 'info');

    try {
      const response = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, language, gender })
      });

      let logMsg = `Status: ${response.status} ${response.statusText}\n`;
      logMsg += `Headers: ${[...response.headers].map(([k,v]) => `${k}: ${v}`).join('\n')}\n`;

      const contentType = response.headers.get('content-type') || '';
      if (contentType.includes('audio')) {
        const blob = await response.blob();
        logMsg += `Audio size: ${blob.size} bytes`;
        if (blob.size === 0) throw new Error('Empty audio');
        const url = URL.createObjectURL(blob);
        audioPlayer.src = url;
        audioPlayer.style.display = 'block';
        await audioPlayer.play();
        setLog(logMsg + '\n✅ Audio played successfully!', 'success');
      } else {
        const body = await response.text();
        logMsg += `Response body:\n${body}`;
        setLog(logMsg, 'error');
      }

    } catch (err) {
      setLog(`❌ Error: ${err.message}`, 'error');
    } finally {
      speakBtn.disabled = false;
    }
  });
</script>
</body>
</html>
